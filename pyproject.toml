[project]
name = "adv-rag"
version = "0.1.0"
description = "Enterprise RAG for Kubernetes IT-Operations: RAG + Text2SQL + caching + LLM security"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Settings & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # LLM
    "openai>=1.54.0",
    "tiktoken>=0.8.0",

    # Vector DB & embeddings
    "qdrant-client>=1.12.0",

    # Sparse retrieval (in-process TF-IDF)
    "scikit-learn>=1.5.0",

    # Doc parsing
    "docling>=2.9.0",
    "pypdf>=5.1.0",

    # Postgres
    "psycopg2-binary>=2.9.10",

    # Cache
    "upstash-redis>=1.2.0",

    # Auth
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 reads bcrypt.__about__, which bcrypt >= 4.1 removed. Pin to the
    # last 4.0.x so #20's password hashing works without the noisy fallback path.
    "bcrypt>=4.0.1,<4.1",

    # Logging
    "loguru>=0.7.2",

    # Agent orchestration
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",

    # Reranking (local + hosted)
    "sentence-transformers>=3.3.0",
    "voyageai>=0.3.0",

    # CRAG web-search fallback
    "tavily-python>=0.5.0",

    # Security scanning
    "llm-guard>=0.3.15",

    # Doc-dedup storage backend
    "boto3>=1.35.0",

    # Eval goldens parsing
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0",
    "types-requests>=2.32.0",
]
# Declared + pinned now; installed by their own slices to keep `--extra dev` lean.
# eval harness — ticket #33 pins the exact ragas/langchain combination it needs.
eval = ["ragas>=0.2.0"]
# demo UI — ticket #34.
ui = ["streamlit>=1.40.0", "requests>=2.32.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
