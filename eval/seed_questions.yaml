# Golden question set for the eval harness (issue #33).
#
# Adapted from the reference tutorial's eval/seed_questions.yaml. Two fixes applied
# to every entry vs. the original:
#   1. golden_sources rewritten from short names (pods.html) to this project's real
#      ingested filenames (concepts__workloads__pods.html) — see spec.md / issue #33
#      ("reconcile golden source names").
#   2. 7 goldens referenced documents that did not exist anywhere (not in this
#      project, not in the reference tutorial). Fixed by adding real content to
#      seed/docs/true_data/: 5 real Kubernetes.io pages (troubleshooting, images,
#      pod-lifecycle, resource management, HPA) and 2 short fictional internal SRE
#      docs (incident-response-runbook, oncall-escalation-policy) grounded in the
#      incidents/alerts/oncall_logs schema in seed/migrations/003_seed_k8s_ops.sql.
#      See NOTES in this file's git history / PR description for the mapping.

