# ==================== ADAPTIVE RETRIEVAL (2 goldens — this project's own feature, not in the reference tutorial) ====================
# Uses `expected_route` (checked by eval.post_checks.route_check against
# response.metadata.route), not source_overlap, as the pass/fail signal — retrieval
# being skipped on purpose isn't a missing source, it's the point. See
# app/services/rag_service.py's `needs_retrieval` / `skip_retrieval` logic.

- id: q-041
  question: "What temperature does water boil at, in Celsius, at sea level?"
  intent: rag
  golden_sources:
    - no_retrieval_expected
  golden_answer_keywords:
    - "100"
    - celsius
  demonstrates_feature: adaptive_retrieval
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag_general_knowledge
  notes: "Pure general-knowledge question, unrelated to Kubernetes. With adaptive retrieval on, needs_retrieval() should say no and the graph should answer directly (route=rag_general_knowledge, no chunks fetched). Naive never has adaptive retrieval on, so it can never produce that route — expected_baseline: fail is about the route, not answer correctness (naive may still answer this fine via a slower path)."

- id: q-042
  question: "What are Kubernetes DaemonSets used for?"
  intent: rag
  golden_sources:
    - concepts__workloads__controllers__daemonset.html
  golden_answer_keywords:
    - DaemonSet
    - node
  demonstrates_feature: adaptive_retrieval
  expected_baseline: pass
  expected_with_feature: pass
  expected_route: rag
  notes: "The opposite direction from q-041: a genuine K8s question that needs real retrieval. Confirms adaptive retrieval doesn't wrongly skip a question that actually needs the corpus — needs_retrieval() should say yes, route stays 'rag', normal retrieval happens. Reuses q-034's question/source deliberately, since the point here is the route decision, not a new retrieval scenario."

