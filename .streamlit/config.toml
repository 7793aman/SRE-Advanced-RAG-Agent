# "Arctic reflection" theme: dark navy base (replaces "Opaline" after it
# read as too bright), a lighter steel-blue-grey sidebar, a mid steel-blue
# accent, and near-white text. Full reskin again, not a tweak — see
# spec.md's "Demo UI (issue #34)" section for the writeup.
[theme]
base = "dark"
primaryColor = "#5289AD"
backgroundColor = "#243C4C"
secondaryBackgroundColor = "#698696"
textColor = "#F4FCFB"
font = "sans serif"

[server]
headless = true
