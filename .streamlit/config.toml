# "Opaline" theme: a near-white neutral scale (not pure white) with one
# coral-red accent reserved for interactive elements. Replaces the earlier
# "Claude Dark" warm-dark/terracotta theme (issue #34) wholesale, not a
# tweak — see spec.md's "Demo UI (issue #34)" section for the writeup.
[theme]
base = "light"
primaryColor = "#FF634A"
backgroundColor = "#F4F4F6"
secondaryBackgroundColor = "#E7E7E7"
textColor = "#1E1E1E"
font = "sans serif"

[server]
headless = true
